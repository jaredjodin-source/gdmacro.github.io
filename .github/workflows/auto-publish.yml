name: Auto-Publish Macros

on:
  issues:
    types: [opened]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Extract and Download Macro from Issue
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p macros
          echo "Analyzing issue body for macros..."
          
          # Récupère tous les liens présents dans l'issue
          urls=$(echo "$ISSUE_BODY" | grep -oE "https://[a-zA-Z0-9./_%?-]+" || true)
          
          downloaded=0
          for url in $urls; do
            # Vérifie si le lien correspond à une extension de macro autorisée
            if [[ "$url" =~ \.(gdr|gdr2|echo|json|bot)(\?.*)?$ ]]; then
              filename=$(basename "${url%%\?*}")
              echo "Downloading $filename..."
              curl -L "$url" -o "macros/$filename"
              downloaded=$((downloaded + 1))
            fi
          done
          
          echo "Downloaded $downloaded macro(s)."

      - name: Commit and Push to GitHub
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Auto-publish macro from issue #${{ github.event.issue.number }}"
          branch: main

      - name: Close Issue with comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUM: ${{ github.event.issue.number }}
        run: |
          gh issue close "$ISSUE_NUM" --comment "🎉 Macro validée et publiée !!"
          
